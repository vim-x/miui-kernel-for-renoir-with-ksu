name: Remove KSU Folder (Submodule)

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Remove old KSU
        run: | 
          git config --global user.email "you@example.com"
          git config --global user.name "zeroXone-github"
          rm -rf KernelSU
          git add .
          git commit -m "Remove old KSU"
          git push origin
